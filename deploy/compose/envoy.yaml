static_resources:
  listeners:
  - name: hydra_ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9000
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: hydra_tcp
          cluster: hydra_optimal_cluster

  clusters:
  # Default Optimal Cluster (Auto-routed by Control Plane)
  - name: hydra_optimal_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: hydra_optimal_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: broker-india
                port_value: 9092
          load_balancing_weight: 100

  # Germany Broker Cluster (EU Legal Jurisdictions)
  - name: cluster_broker_germany
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: cluster_broker_germany
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: broker-germany
                port_value: 9093

  # Singapore Broker Cluster (APAC / Resilient Fallback)
  - name: cluster_broker_singapore
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: cluster_broker_singapore
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: broker-singapore
                port_value: 9094
