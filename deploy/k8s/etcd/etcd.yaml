apiVersion: v1
kind: Service
metadata:
  name: hydra-etcd
  labels:
    app: hydra-etcd
spec:
  ports:
    - port: 2379
      name: client
  clusterIP: None
  selector:
    app: hydra-etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hydra-etcd
spec:
  serviceName: hydra-etcd
  replicas: 1
  selector:
    matchLabels:
      app: hydra-etcd
  template:
    metadata:
      labels:
        app: hydra-etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.12
          command:
            - /usr/local/bin/etcd
            - --advertise-client-urls=http://hydra-etcd:2379
            - --listen-client-urls=http://0.0.0.0:2379
          ports:
            - containerPort: 2379
              name: client
