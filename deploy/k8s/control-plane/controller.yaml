apiVersion: v1
kind: ConfigMap
metadata:
  name: hydra-controller-config
data:
  CONTROLLER_PORT: "8080"
  ETCD_ENDPOINTS: "http://hydra-etcd:2379"
  ENABLE_ETCD: "true"
  PROMETHEUS_URL: "http://hydra-prometheus:9090"
  ENABLE_PROMETHEUS: "true"
  SEED_FALLBACK: "false"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-controller
  labels:
    app: hydra-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra-controller
  template:
    metadata:
      labels:
        app: hydra-controller
    spec:
      containers:
        - name: controller
          image: hydra-controller:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hydra-controller-config
          ports:
            - containerPort: 8080
              name: http-api
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hydra-controller
  labels:
    app: hydra-controller
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http-api
  selector:
    app: hydra-controller
