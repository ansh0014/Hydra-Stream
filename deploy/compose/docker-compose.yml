networks:
  hydra-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  # Dynamic Service Registry (etcd v3)
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: hydra-etcd
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - hydra-mesh

  # Inter-region Link Latency & Metrics Scraping
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hydra-prometheus
    ports:
      - "9090:9090"
    networks:
      - hydra-mesh

  # Dynamic L4 Envoy Proxy
  envoy:
    image: envoyproxy/envoy:v1.29.2
    container_name: hydra-envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "9000:9000"
    depends_on:
      - broker-india
      - broker-germany
      - broker-singapore
    networks:
      - hydra-mesh

  # Regional Broker Node 1: India
  broker-india:
    build:
      context: ../../broker
      dockerfile: Dockerfile
    container_name: hydra-broker-india
    environment:
      - BROKER_ID=broker-india-1
      - REGION=India
      - PORT=9092
      - HEALTH_PORT=8081
      - ETCD_ENDPOINT=etcd:2379
    ports:
      - "9092:9092"
      - "8081:8081"
    depends_on:
      - etcd
    networks:
      - hydra-mesh

  # Regional Broker Node 2: Germany (EU Legal Data Jurisdiction)
  broker-germany:
    build:
      context: ../../broker
      dockerfile: Dockerfile
    container_name: hydra-broker-germany
    environment:
      - BROKER_ID=broker-germany-1
      - REGION=Germany
      - PORT=9093
      - HEALTH_PORT=8082
      - ETCD_ENDPOINT=etcd:2379
    ports:
      - "9093:9093"
      - "8082:8082"
    depends_on:
      - etcd
    networks:
      - hydra-mesh

  # Regional Broker Node 3: Singapore
  broker-singapore:
    build:
      context: ../../broker
      dockerfile: Dockerfile
    container_name: hydra-broker-singapore
    environment:
      - BROKER_ID=broker-singapore-1
      - REGION=Singapore
      - PORT=9094
      - HEALTH_PORT=8083
      - ETCD_ENDPOINT=etcd:2379
    ports:
      - "9094:9094"
      - "8083:8083"
    depends_on:
      - etcd
    networks:
      - hydra-mesh

  # Hydra Sovereign Control Plane (Go Policy & Latency Router)
  control-plane:
    build:
      context: ../../control-plane
      dockerfile: Dockerfile
    container_name: hydra-control-plane
    environment:
      - CONTROLLER_PORT=8080
      - ETCD_ENDPOINTS=http://etcd:2379
      - ENABLE_ETCD=true
      - PROMETHEUS_URL=http://prometheus:9090
      - ENABLE_PROMETHEUS=true
      - SEED_FALLBACK=false
    ports:
      - "8080:8080"
    depends_on:
      - etcd
      - prometheus
    networks:
      - hydra-mesh

  # Hydra React Dashboard & Express Ingress Proxy
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: hydra-frontend
    environment:
      - PORT=3000
      - CONTROLLER_URL=http://control-plane:8080
      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "3000:3000"
    depends_on:
      - control-plane
    networks:
      - hydra-mesh
