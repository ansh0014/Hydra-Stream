schema_version: 1

experiment:
  name: geo-resilience-and-slow-link
  seed: 98765
  duration: 180s
  target_sdg: "SDG 9.1 - Resilient Infrastructure"
  tags: [cross-region, slow-link, data-residency, tc-netem]

cluster:
  provider: docker-compose
  registry: etcd
  discovery_endpoint: "http://127.0.0.1:2379"
  metrics_endpoint: "http://127.0.0.1:9090"
  regions:
    - name: India
      brokers: [broker-india-1]
    - name: Germany
      brokers: [broker-germany-1]
      legal_jurisdiction: EU_GDPR
    - name: Singapore
      brokers: [broker-singapore-1]
  require_disposable_environment: true

topics:
  - name: gdpr-user-audit
    legal_region: Germany
    partitions: 4
  - name: upi-transactions
    legal_region: India
    partitions: 4
  - name: apac-fx
    legal_region: Singapore
    partitions: 4
  - name: global-telemetry
    legal_region: ANY
    partitions: 6

faults:
  - id: slow-link-india
    tool: "linux-tc-netem"
    target_container: "hydra-broker-india"
    at: 10s
    duration: 30s
    action: "delay 260ms 15ms loss 10%"
    script_command: "scripts\\hydra.bat chaos hydra-broker-india apply 260ms 15ms 10%"
    recovery_command: "scripts\\hydra.bat chaos hydra-broker-india clear"

assertions:
  - id: legal-residency-enforced
    type: legal_data_residency_respected
    target_topic: gdpr-user-audit
    allowed_region: Germany
    violations_allowed: 0

  - id: slow-link-bypassed
    type: route_bypassed_during_degradation
    fault_ref: slow-link-india
    bypass_expected: true
