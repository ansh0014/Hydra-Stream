apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
    scrape_configs:
      - job_name: 'hydra-brokers'
        static_configs:
          - targets: ['broker-india:8081', 'broker-germany:8082', 'broker-singapore:8083']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra-prometheus
  template:
    metadata:
      labels:
        app: hydra-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: hydra-prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  selector:
    app: hydra-prometheus
